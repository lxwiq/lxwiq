      <stop offset="0%" stop-color="#181209"/>
      <stop offset="55%" stop-color="#0F0C08"/>
      <stop offset="100%" stop-color="#090706"/>
    </linearGradient>
    <radialGradient id="glowD" cx="0.9" cy="0.06" r="0.85">
