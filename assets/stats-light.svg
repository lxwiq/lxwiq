      <text x="254" y="200" fill="#231A11" font-size="17" font-weight="700" text-anchor="end">0</text>
    </g>
    <g><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.44999999999999996s" fill="freeze"/>
      <circle cx="287" cy="195" r="3" fill="#C2740F"/>
