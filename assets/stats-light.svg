<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 286" width="520" height="286" role="img" aria-label="GitHub statistics for lxwiq" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFCF5"/>
      <stop offset="55%" stop-color="#FEF6E7"/>
      <stop offset="100%" stop-color="#FBEBD2"/>
    </linearGradient>
    <radialGradient id="glowL" cx="0.9" cy="0.06" r="0.85">
      <stop offset="0%" stop-color="#F0A62E" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#C2740F" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#C2740F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ruleL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B4651C" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#B4651C" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dotsL" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#B4651C" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="cardL"><rect x="0" y="0" width="520" height="286" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#cardL)">
    <rect width="520" height="286" fill="url(#bgL)"/>
    <rect width="520" height="286" fill="url(#dotsL)"/>
    <rect width="520" height="286" fill="url(#glowL)"/>
    <text x="40" y="58" fill="#231A11" font-size="23" font-weight="700" letter-spacing="-0.3">GitHub stats</text>
    <rect x="40" y="72" width="120" height="2.5" rx="1.25" fill="url(#ruleL)"/>
    <g><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.15s" fill="freeze"/>
