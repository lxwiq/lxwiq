      <text x="300" y="156" fill="#6B5847" font-size="14.5">Stars earned</text>
      <text x="498" y="156" fill="#231A11" font-size="17" font-weight="700" text-anchor="end">9</text>
    </g>
    <g><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.39s" fill="freeze"/>
